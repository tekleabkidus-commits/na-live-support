# Egress proxy (ADR 0008; Doc 04 SEC-03; CLAUDE.md §3 egress rule).
#
# FilterDefaultDeny makes the FILTER FILE the allowlist: a destination host not
# matched there is refused with 403 BY THE PROXY — the SEC-03 test asserts that
# refusal, so the control is the network topology, not a PHP guard.

Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 50

# Internal compose network only; no published port.
Allow 0.0.0.0/0

Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
# Match the filter against the destination HOST, not the full URL.
FilterURLs No

ConnectPort 443
ConnectPort 9000

LogLevel Notice
