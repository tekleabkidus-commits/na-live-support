# redis-durable — queues / outbox relay state / timers ONLY (CLAUDE.md §3).
# Nothing on this instance is evictable; work stored here must survive a
# restart. Cache keys must NEVER live here — see config/database.php.
# maxmemory-policy noeviction: when full, writes fail loudly instead of
# silently discarding a queued job. Evictions/OOM here page immediately
# (Doc 18 FR-16).
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
