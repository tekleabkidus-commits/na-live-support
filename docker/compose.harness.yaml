# THE HARNESS — Doc 13's local two-origin fixture (R-D13-1.1). NEVER the origin.
#
# Ruling of record: no public staging subdomain with TLS exists (R-D13-1,
# docs/ADVISOR-RULINGS-D13.md). Everything a browser enforces LOCALLY — CORS
# preflight, frame-ancestors, ancestor-chain validation, the cookie-less media
# origin as its own host, Reverb channel-auth from a foreign origin — is proven
# against this overlay. Rows only a real public origin can prove ride the [OA]
# bucket; a harness result is NEVER written as proof of an [OA] row (R-D13-1.3).
#
# Three hostnames, one Caddy, one port. `*.localhost` resolves to loopback on
# the dev box by glibc (verified: `getent hosts platform.harness.localhost`
# → ::1) and in every browser Playwright drives (RFC 6761), so no /etc/hosts
# edit is needed — WSL regenerates that file at boot anyway.
#
#   https://platform.harness.localhost:8443  → the app (API, widget/v1/*, the
#                                              loader/bundle shims) and, on
#                                              /app/* + /apps/*, Reverb
#   https://media.harness.localhost:8443     → the app again, AS A SEPARATE
#                                              HOST — the cookie-less media
#                                              origin of Doc 04 (no session
#                                              cookie is ever scoped to it)
#   https://customer.harness.localhost:8443  → a static "operator site":
#                                              widget/harness/customer/ (the
#                                              host page + the hostile-host
#                                              fixture, SS-03)
#
# Runs on the app image (no new image, no new dependency): the image already
# carries Caddy (FrankenPHP) and the image-baked DEV CA, so the harness cert is
# signed by that CA at container start and every in-container client validates
# it; the CA is public by construction (docker/app/generate-dev-certs.sh).
#
# Usage (dev only — CI's raw compose never names this file):
#   docker compose --profile embeddings -f docker/compose.yaml \
#     -f docker/compose.dev.yaml -f docker/compose.harness.yaml up -d harness

name: na-live-support

services:
  harness:
    image: na-live-support/app:dev
    entrypoint: ["/bin/sh", "/harness/entrypoint.sh"]
    volumes:
      - ./harness:/harness:ro
      - ../widget/harness/customer:/srv/customer:ro
    ports:
      - "8443:8443"
    networks: [na-net]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Validates the chain against the image's trust store (the dev CA).
      test: ["CMD", "curl", "-fsS", "--resolve", "customer.harness.localhost:8443:127.0.0.1", "https://customer.harness.localhost:8443/harness-alive"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── The two processes the dev stack never had (filed at S13 step 8b): ──────────
  # (1) the outbound LANES worker for the fixture tenant — Doc 04 T-05's one-process-
  #     per-tenant rule (the multi-tenant wiring is Doc 18's); without it an outbound
  #     row stays `queued` and no push ever reaches the visitor;
  # (2) a consumer for the `default` queue, where every `RealtimePush` (ShouldBroadcast)
  #     lands and which NO per-family Horizon supervisor drains (9964 stale pushes found
  #     on the dev stack). The production topology for broadcasts is a Doc 07 / Doc 18
  #     decision — this is the harness's own drain so the browser can be shown a real frame.
  harness-lanes:
    image: na-live-support/app:dev
    entrypoint: ["/bin/sh", "/harness/lanes.sh"]
    env_file: ../.env
    volumes:
      - ./harness:/harness:ro
    networks: [na-net]
    depends_on:
      app:
        condition: service_healthy
    # S13 Batch C (F-C2, found FATAL in CI run 33972978742): without its own healthcheck this worker inherits the
    # frankenphp base image's `curl -f http://localhost:2019/metrics`, which only a Caddy process answers — so it
    # reports unhealthy and CI's `compose up --wait` refuses the whole stack before a single browser test runs.
    # The relay's proven pattern (docker/compose.yaml): the process is alive when its command line is in /proc.
    healthcheck:
      # ALIVE while WAITING too: in CI the fixture tenant is seeded AFTER the bring-up (Stage 4 step 9), so at
      # bring-up the script (`/bin/sh /harness/lanes.sh`, PID 1) is still in its tenant loop — run 33975886140
      # on 7025d7a went unhealthy on exactly that (locally the tenant already existed, so the check passed).
      test: ["CMD", "sh", "-c", "grep -aq 'lanes[.]sh\\|lanes[:]work' /proc/*/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s   # lanes.sh waits for the fixture tenant (a tinker loop) before exec'ing lanes:work
  harness-broadcast:
    image: na-live-support/app:dev
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=1", "--tries=1", "--timeout=30"]
    env_file: ../.env
    environment:
      # The broadcaster's TARGET is the reverb service on the compose network — `.env`'s
      # REVERB_HOST=localhost is the BROWSER-facing host and, inside a container, connects to
      # nothing (cURL 7 on every push — the second half of the same filed finding).
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: https
    networks: [na-net]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:   # same reason as harness-lanes (F-C2)
      test: ["CMD", "sh", "-c", "grep -aq 'queue[:]work' /proc/*/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
