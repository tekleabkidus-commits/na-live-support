# Na Live Support — local/CI stack (Session 0, Doc 18 §4).
# Parity rule (Doc 01 SEC-01): RLS, Octane, and real queue workers are ON
# here. Local is never a softer environment than production.
#
# Host ports: app 443 (+80 redirect) · reverb 8080 (wss) · postgres 5432 · redis-volatile 6379 ·
# redis-durable 6380 · meilisearch 7700 · minio 9000/9001 · mailpit 8025/1025.
# Mocks and clamav are reachable on the private network only.

name: na-live-support

networks:
  na-net:
    driver: bridge

volumes:
  postgres-data:
  redis-durable-data:
  meilisearch-data:
  minio-data:
  clamav-data:

x-app-image: &app-image
  build:
    context: ..
    dockerfile: docker/app/Dockerfile
  image: na-live-support/app:dev
  env_file: ../.env
  volumes:
    # The image ships no .env (hygiene); the dev stack mounts the project's
    # one read-only so artisan/tests see the same env the services got.
    - ../.env:/app/.env:ro
  networks: [na-net]
  depends_on:
    postgres:
      condition: service_healthy
    redis-volatile:
      condition: service_healthy
    redis-durable:
      condition: service_healthy

services:
  app:
    <<: *app-image
    ports:
      # 443 is the real surface; 80 exists only to 308-redirect to it
      # (Doc 02 SEC-06 — nothing is ever served over cleartext).
      - "443:443"
      - "80:80"
    healthcheck:
      # No --insecure: the dev CA is in the image's trust store, so this
      # validates the chain. A healthcheck that skips validation cannot
      # notice a broken certificate, which is half of what it is for.
      test: ["CMD", "curl", "-fsS", "https://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *app-image
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  # The outbox relay (C-06's live half): committed outbox rows → the events
  # log + event queues. A DEDICATED process by advisor ruling (2026-08-13,
  # S07 step 14): the RelayOutbox command is built to run continuously, and
  # until this service existed NOTHING started it — every live event-driven
  # path was dead outside test processes (the S07 step-14 discovery). Its
  # death must stay observable independently of the worker's (FS-01).
  relay:
    <<: *app-image
    command: ["php", "artisan", "outbox:relay"]
    healthcheck:
      # Process liveness (no pgrep in the image): the artisan loop's own
      # process list entry — a dead loop fails this within one interval.
      test: ["CMD", "sh", "-c", "ps ax | grep -v grep | grep -q 'outbox:relay'"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  scheduler:
    <<: *app-image
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3

  reverb:
    <<: *app-image
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    healthcheck:
      # A TLS handshake, not a bare TCP connect: fsockopen succeeds against a
      # listener that is failing to serve TLS at all, so the old check would
      # have reported healthy for a Reverb that no wss:// client could use.
      # $$ escapes compose's own variable interpolation — a single $ made
      # compose substitute empty strings and the check silently tested nothing.
      test: ["CMD-SHELL", "php -r '$$c=@stream_socket_client(\"ssl://localhost:8080\", $$e, $$s, 5); exit($$c ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-volatile:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/volatile.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks: [na-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-durable:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/durable.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-durable-data:/data
    ports:
      - "6380:6379"
    networks: [na-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.16
    environment:
      MEILI_MASTER_KEY: local_master_key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "7700:7700"
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio_local
      MINIO_ROOT_PASSWORD: minio_local_secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [na-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [na-net]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  egress-proxy:
    build:
      context: ./egress-proxy
    image: na-live-support/egress-proxy:dev
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888"]  # 127.0.0.1, NOT localhost: alpine resolves localhost to ::1 first and tinyproxy listens on IPv4 only
      interval: 10s
      timeout: 3s
      retries: 6

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [na-net]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  mock-telegram:
    build:
      context: ./mocks
      args: { SERVICE: telegram }
    image: na-live-support/mock-telegram:dev
    environment: { PORT: 8081 }
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  mock-sms:
    build:
      context: ./mocks
      args: { SERVICE: sms }
    image: na-live-support/mock-sms:dev
    environment: { PORT: 8082 }
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  mock-ai:
    build:
      context: ./mocks
      args: { SERVICE: ai }
    image: na-live-support/mock-ai:dev
    environment: { PORT: 8083 }
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
