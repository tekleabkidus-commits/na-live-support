# Na Live Support — local/CI stack (Session 0, Doc 18 §4).
# Parity rule (Doc 01 SEC-01): RLS, Octane, and real queue workers are ON
# here. Local is never a softer environment than production.
#
# Host ports: app 443 (+80 redirect) · reverb 8080 (wss) · postgres 5432 · redis-volatile 6379 ·
# redis-durable 6380 · meilisearch 7700 · minio 9000/9001 · mailpit 8025/1025.
# Mocks and clamav are reachable on the private network only.

name: na-live-support

networks:
  na-net:
    driver: bridge

volumes:
  postgres-data:
  smpp-certs:   # Doc 14 T-03 (S14 step 4): the mock sidecar's mTLS material, read by the app (FIXTURE keys, public by construction)
  redis-durable-data:
  meilisearch-data:
  minio-data:
  clamav-data:

x-app-image: &app-image
  build:
    context: ..
    dockerfile: docker/app/Dockerfile
  image: na-live-support/app:dev
  env_file: ../.env
  volumes:
    # The image ships no .env (hygiene); the dev stack mounts the project's
    # one read-only so artisan/tests see the same env the services got.
    - ../.env:/app/.env:ro
    # Doc 14 T-03 (S14 step 4): the SMPP sidecar's mTLS material (CA + the client cert the sidecar requires of us).
    - smpp-certs:/certs-smpp:ro
  networks: [na-net]
  depends_on:
    postgres:
      condition: service_healthy
    redis-volatile:
      condition: service_healthy
    redis-durable:
      condition: service_healthy

services:
  app:
    <<: *app-image
    ports:
      # 443 is the real surface; 80 exists only to 308-redirect to it
      # (Doc 02 SEC-06 — nothing is ever served over cleartext).
      - "443:443"
      - "80:80"
    healthcheck:
      # No --insecure: the dev CA is in the image's trust store, so this
      # validates the chain. A healthcheck that skips validation cannot
      # notice a broken certificate, which is half of what it is for.
      test: ["CMD", "curl", "-fsS", "https://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *app-image
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s

  # The outbox relay (C-06's live half): committed outbox rows → the events
  # log + event queues. A DEDICATED process by advisor ruling (2026-08-13,
  # S07 step 14): the RelayOutbox command is built to run continuously, and
  # until this service existed NOTHING started it — every live event-driven
  # path was dead outside test processes (the S07 step-14 discovery). Its
  # death must stay observable independently of the worker's (FS-01).
  relay:
    <<: *app-image
    command: ["php", "artisan", "outbox:relay"]
    # unless-stopped: the relay boots WITH the stack, before migrations exist
    # on a fresh database — its first query dies on the missing table and the
    # policy brings it back until the schema does (observed at first boot:
    # 42P01 → exit 1). A recovery mechanism that stays dead after a transient
    # is the exact failure its own docblock argues against.
    restart: unless-stopped
    healthcheck:
      # Process liveness via /proc directly — the image has NEITHER pgrep
      # NOR ps (found at the Doc 07 close: the old `ps ax` check failed in
      # every environment, invisibly locally where nothing gates on relay
      # health, fatally in CI where `up --wait` does — the floor under all
      # three retry-loop causes of the relay saga). The bracket pattern
      # excludes the check's own cmdline; a dead loop fails within one
      # interval. Verified with a positive AND negative control in-container.
      test: ["CMD", "sh", "-c", "grep -aq 'outbox[:]relay' /proc/*/cmdline"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  scheduler:
    <<: *app-image
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3

  reverb:
    <<: *app-image
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    healthcheck:
      # A TLS handshake, not a bare TCP connect: fsockopen succeeds against a
      # listener that is failing to serve TLS at all, so the old check would
      # have reported healthy for a Reverb that no wss:// client could use.
      # $$ escapes compose's own variable interpolation — a single $ made
      # compose substitute empty strings and the check silently tested nothing.
      test: ["CMD-SHELL", "php -r '$$c=@stream_socket_client(\"ssl://localhost:8080\", $$e, $$s, 5); exit($$c ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  postgres:
    image: pgvector/pgvector:pg16 # ADR 0015: drop-in Postgres 16 + the vector extension (Doc 09 T-05)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_password
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-volatile:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/volatile.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks: [na-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-durable:
    image: redis:7
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/durable.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-durable-data:/data
    ports:
      - "6380:6379"
    networks: [na-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.16
    environment:
      MEILI_MASTER_KEY: local_master_key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "7700:7700"
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    # P-MINIO-REGISTRY (countersigned 2026-09-24; ci run #336 = 35916450403): Docker Hub DENIES the
    # minio/minio repository as of 2026-09-23 (repo-wide, digest pulls included) — every ephemeral
    # runner died at this pull while dev boxes coasted on cache. MinIO's own quay registry serves the
    # IDENTICAL build (RELEASE.2025-09-07T16-13-09Z, same manifest digest), pinned here BY DIGEST.
    # Doc 18 reopener: the deliberate re-pin (and the unpinned-externals class named in BUILD-STATUS).
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio_local
      MINIO_ROOT_PASSWORD: minio_local_secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [na-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [na-net]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 6

  egress-proxy:
    build:
      context: ./egress-proxy
    image: na-live-support/egress-proxy:dev
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8888"]  # 127.0.0.1, NOT localhost: alpine resolves localhost to ::1 first and tinyproxy listens on IPv4 only
      interval: 10s
      timeout: 3s
      retries: 6

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [na-net]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  mock-telegram:
    build:
      context: ./mocks
      args: { SERVICE: telegram }
    image: na-live-support/mock-telegram:dev
    environment: { PORT: 8081 }
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  mock-sms:
    build:
      context: ./mocks
      args: { SERVICE: sms }
    image: na-live-support/mock-sms:dev
    # NODE_TLS_REJECT_UNAUTHORIZED=0: the FIXTURE's DLR callbacks reach https://app, whose chain is the
    # image-baked dev CA the mock image does not trust — a fixture posting to a fixture (S14 step 4).
    environment: { PORT: 8082, NODE_TLS_REJECT_UNAUTHORIZED: "0" }
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Doc 14 T-03 / FR-10 / AC-08 (S14 step 4): the SMPP sidecar's CONTRACT half as a FIXTURE — private
  # HTTPS + mTLS (certs minted into the shared volume at start), POST /send, GET /health, signed DLRs
  # back, POST /_restart for the restart-transparency leg. The real bind + packaging are [D18].
  mock-smpp-sidecar:
    build:
      context: ./mocks/smpp-sidecar
    image: na-live-support/mock-smpp-sidecar:dev
    environment: { PORT: 8443, CERT_DIR: /certs-smpp, NODE_TLS_REJECT_UNAUTHORIZED: "0" }
    volumes:
      - smpp-certs:/certs-smpp
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "test -f /certs-smpp/client.crt"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ADR 0018 — the LOCAL embeddings sidecar (S10 step 0.7, STOP-C ruling):
  # pinned bge-m3 (ONNX, q8, 1024 dims) baked into the image; runtime offline.
  # Under the `embeddings` PROFILE so CI's `up --build` (which never names the
  # profile) stays on the deterministic fake driver per the ruling; `make up`
  # enables it locally. The app tolerates its absence (keyword half serves).
  embeddings:
    build:
      context: ../sidecars/embeddings
    image: na-live-support/embeddings:bge-m3-q8
    profiles: [embeddings]
    environment: { PORT: 8081 }
    networks: [na-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  mock-ai:
    build:
      context: ./mocks
      args: { SERVICE: ai }
    image: na-live-support/mock-ai:dev
    environment: { PORT: 8083 }
    networks: [na-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
