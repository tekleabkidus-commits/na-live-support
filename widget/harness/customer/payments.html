<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HARNESS — /payments page (fixture operator site)</title>
<!--
  Doc 13 step 7: the CLEAN host page. The loader snippet is installed exactly as an
  operator would paste it — one <script src="…/w/<widget key>.js"> — with the key taken
  from ?key= so the static page never carries a credential. Fixtures only.
-->
<style>body{font:16px/1.5 system-ui,sans-serif;margin:2rem;color:#222}</style>
</head>
<body>
<h1>Fixture operator site — /payments</h1>
<p>The widget loader is installed below. This page reads nothing from the widget and the widget reads nothing from this page.</p>
<form><label>A page input the widget must never read: <input id="host-input" value="FIXTURE host value"></label></form>
<script>
  // The footprint audit (AC-02) records every listener the loader adds by wrapping addEventListener
  // BEFORE the loader runs — the host page's own instrumentation, not the widget's.
  window.__harnessListeners = [];
  const origAdd = window.addEventListener.bind(window);
  window.addEventListener = function (type, fn, opts) { window.__harnessListeners.push(type); return origAdd(type, fn, opts); };
  // FR-24's structural clause, audited: the host counts every DOM READ the widget could make on
  // this page (querySelector*, getElementById, getElementsBy*, document.cookie, localStorage).
  // The loader's own writes (appendChild of its two iframes) and its allowed reads (location,
  // document.referrer, activeElement PRESENCE) are not counted. Zero is the only passing count.
  window.__harnessHostReads = [];
  for (const m of ['querySelector', 'querySelectorAll', 'getElementById', 'getElementsByTagName', 'getElementsByClassName']) {
    const orig = document[m].bind(document);
    document[m] = function (...a) { window.__harnessHostReads.push(m); return orig(...a); };
  }
  const cookieDesc = Object.getOwnPropertyDescriptor(Document.prototype, 'cookie');
  Object.defineProperty(document, 'cookie', { get() { window.__harnessHostReads.push('cookie'); return cookieDesc.get.call(document); }, set(v) { cookieDesc.set.call(document, v); } });
  const lsDesc = Object.getOwnPropertyDescriptor(window, 'localStorage');
  Object.defineProperty(window, 'localStorage', { get() { window.__harnessHostReads.push('localStorage'); return lsDesc.get.call(window); } });
  window.__harnessPush = history.pushState; window.__harnessReplace = history.replaceState;
  window.__harnessBaselineGlobals = null; // declared before the snapshot so the snapshot contains it
  window.__harnessBaselineGlobals = Object.getOwnPropertyNames(window);
  const key = new URLSearchParams(location.search).get('key');
  const platform = new URLSearchParams(location.search).get('platform') || 'https://platform.harness.localhost:8443';
  if (key) {
    const s = document.createElement('script');
    s.src = platform + '/w/' + encodeURIComponent(key) + '.js';
    s.dataset.harness = 'snippet';
    if (new URLSearchParams(location.search).get('twice') === '1') {
      const s2 = document.createElement('script'); s2.src = s.src; s2.dataset.harness = 'snippet-2';
      document.head.appendChild(s); document.head.appendChild(s2);
    } else {
      document.head.appendChild(s);
    }
  }
</script>
</body>
</html>
