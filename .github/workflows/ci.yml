# Na Live Support CI (Doc 18 FR-07 stage order):
#   lint+static → unit → integration (ephemeral stack) → browser →
#   performance budgets → (deploy stages stubbed until Doc 18's session)
name: ci

on:
  push:
  pull_request:

jobs:
  lint-static:
    name: "Stage 1: lint + static"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pcntl, redis, pdo_pgsql, intl, zip, gd, bcmath
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G
      - run: npx eslint resources/js tests/Browser
      - run: npx vue-tsc --noEmit

  unit:
    name: "Stage 2: unit"
    runs-on: ubuntu-latest
    needs: lint-static
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pcntl, redis, pdo_pgsql, intl, zip, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      # Unit ONLY: the Feature suite is container-only by design (owner ruling
      # D-4 — SQLite cannot express RLS, so every Feature test runs against the
      # stack's Postgres). Feature runs in Stage 3 with the rest of the
      # in-stack suites; run 30608024521 is what happens otherwise.
      - run: ./vendor/bin/pest --testsuite=Unit

  integration:
    name: "Stage 3: integration (ephemeral stack)"
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      # The gate runner executes host-side here (registry checks, linters), and
      # ci/isolation-suite.sh execs into the app container — so this stage needs
      # PHP + vendor on the runner as well as the stack.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pcntl, redis, pdo_pgsql, intl, zip, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # APP_KEY is injected host-side BEFORE up: containers mount .env
      # read-only, so key:generate cannot write it in-container (same class
      # of failure `make fresh` hit locally in Session 0).
      - run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=$|APP_KEY=base64:$(openssl rand -base64 32)|" .env
      - name: Bring up the ephemeral stack (same compose as local — parity)
        run: docker compose -f docker/compose.yaml up -d --build --wait --wait-timeout 600
      # The MAIN stack database gets its schema the way a deploy would. The test
      # harness migrates only na_live_support_test (per process, migrator role);
      # StackSmokeTest inspects na_live_support itself — run 30608153474 failed
      # because the S1 function-ownership assertion was the first smoke check to
      # need real schema there, and only local dev had ever migrated it.
      - name: Migrate the stack database (same command as `make fresh`)
        run: docker compose -f docker/compose.yaml exec -T app php artisan migrate:fresh --seed --force --database=pgsql_migrator
      # The object store's schema-equivalent: the media bucket (Doc 04 T-04).
      # Same command as `make fresh`; production bucket provisioning is Doc 18's
      # IaC. Run 30991248392 is what happens without it — every media/retention
      # test fails UnableToWriteFile against a bucketless MinIO.
      - name: Provision the media bucket (same command as `make fresh`)
        run: docker compose -f docker/compose.yaml exec -T minio sh -c "mc alias set local http://localhost:9000 minio_local minio_local_secret >/dev/null && mc mb --ignore-existing local/na-live-support"
      # The gates run HERE, not in Stage 1: the isolation-suite gate is
      # container-only (Doc 01 §21 — it must never report PASS without running),
      # and the stack it needs exists only in this stage. Same placement as
      # local: `make gates` also requires the stack up. All 10 gates remain
      # blocking; run 30607808128 is what happens when they run stackless.
      - name: CI gates (registries/gates.yaml order)
        run: bash ci/run-gates.sh
      # PARITY IS THE POINT, AND IT USED TO BE A LIE. This step ran bare `pest`
      # under a comment claiming parity with `make test` — but `make test` is
      # `pest --exclude-group=soak`. So CI silently ran the 10k soak INSIDE the
      # shared suite, which is the one configuration known to corrupt the tests
      # that follow it, while the owner was told the soak "runs in CI". The flag
      # below makes the comment true. The soak has its own job (Stage 3b) — it
      # is not skipped, it is OWNED.
      - name: Full Pest suite inside the stack (parity with local `make test`)
        run: docker compose -f docker/compose.yaml exec -T app ./vendor/bin/pest --exclude-group=soak
      - name: Stack teardown
        if: always()
        run: docker compose -f docker/compose.yaml down -v

  # ---------------------------------------------------------------------------
  # Stage 3b: the AC-03 ordering soak, ALONE in its own process and its own
  # stack (owner ruling R-18, session S21 step 0b).
  #
  # WHY A DEDICATED JOB. Before this existed the soak sat in a gap: excluded
  # from `make test`, and in CI only as an unnamed passenger of the bare `pest`
  # invocation above. Nobody owned it, no artifact survived it, and the question
  # "is AC-03's ordering guarantee proven?" had two different answers depending
  # on which command you happened to run. That gap is how a flaky proof survived
  # a close-out. This job is now the SINGLE place that question is answered.
  #
  # It runs the soak alone — the same shape as local `make soak` — because the
  # soak commits its fixtures and the interaction between that and the shared
  # harness transaction is an OPEN defect (BUILD-STATUS RISK 0a). Running it
  # alone is the containment, and it is stated rather than implied.
  #
  # The run is CAPTURED to docs/evidence/ and uploaded as an artifact even on
  # failure — RISK 0b's capture-first protocol. An intermittent failure whose
  # log died with the runner is the exact incident this pipeline has had twice.
  # ---------------------------------------------------------------------------
  soak:
    name: "Stage 3b: AC-03 10k ordering soak (alone)"
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=$|APP_KEY=base64:$(openssl rand -base64 32)|" .env
      - name: Bring up the ephemeral stack (same compose as local — parity)
        run: docker compose -f docker/compose.yaml up -d --build --wait --wait-timeout 600
      - name: Provision the media bucket (same command as `make fresh`)
        run: docker compose -f docker/compose.yaml exec -T minio sh -c "mc alias set local http://localhost:9000 minio_local minio_local_secret >/dev/null && mc mb --ignore-existing local/na-live-support"
      - name: The soak, alone, captured first (RISK 0b)
        run: CAPTURE_SET=ci-soak bash ci/capture.sh soak docker compose -f docker/compose.yaml exec -T app ./vendor/bin/pest --group=soak
      - name: Upload the captured run (pass OR fail — this is the evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ac03-soak-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/evidence/ci-soak/
          if-no-files-found: error
      - name: Stack teardown
        if: always()
        run: docker compose -f docker/compose.yaml down -v

  browser:
    name: "Stage 4: browser (Playwright + axe)"
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=$|APP_KEY=base64:$(openssl rand -base64 32)|" .env
      - run: docker compose -f docker/compose.yaml up -d --build --wait --wait-timeout 600
      # The browser stage brings up a FRESH stack, so its database is empty. The
      # session suite (Doc 02 step 6) logs in for real — it needs schema and an
      # account, and it cannot create one through a UI that does not exist yet.
      - name: Migrate and seed browser fixtures
        run: |
          docker compose -f docker/compose.yaml exec -T app php artisan migrate:fresh --force --database=pgsql_migrator
          docker compose -f docker/compose.yaml exec -T app php artisan db:seed --class='Database\Seeders\BrowserFixtureSeeder' --force
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          BASE_URL: https://localhost
      - if: always()
        run: docker compose -f docker/compose.yaml down -v

  performance:
    name: "Stage 5: performance budgets (placeholder until Doc 19 L1 profile)"
    runs-on: ubuntu-latest
    needs: browser
    steps:
      - uses: actions/checkout@v4
      - name: Performance budgets
        run: |
          echo "Performance budgets run here from Doc 19's L1 load profile onward."
          echo "Session 0 has no budgets to enforce yet; this stage exists so the"
          echo "pipeline shape (Doc 18 FR-07) is fixed from the first commit."

  # ---- deploy stages (stubbed; Doc 18's session implements them) ----------
  deploy-staging:
    name: "Stage 6: deploy to staging (STUB)"
    runs-on: ubuntu-latest
    # `soak` is named here so the AC-03 job is BLOCKING rather than a leaf job
    # nobody's release depends on. A green pipeline now means the soak was run
    # and passed, not that it was quietly skipped.
    needs: [performance, soak]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "STUB — staging deploy is implemented in Doc 18's session."

  deploy-production:
    name: "Stage 7: deploy to production (STUB, manual approval)"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: false  # never runs until Doc 18's session wires environments + approvals
    steps:
      - run: echo "STUB — production deploy is implemented in Doc 18's session."
