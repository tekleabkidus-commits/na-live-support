    owning_ac: AC-01
    owner: platform-engineering
    added_date: "2026-07-27"
    blocking: true

  - gate_id: audit-coverage
    name: Every state-mutating action has an audit-coverage entry
    command: php ci/audit-coverage.php
    owning_doc: Doc17
    owning_ac: AC-01
    owner: platform-engineering
    added_date: "2026-07-27"
    blocking: true

  - gate_id: traceability
    name: Every AC in /docs maps to a test entry
    command: php ci/traceability.php
    owning_doc: Doc19
    owning_ac: FR-02
    owner: qa
    added_date: "2026-07-27"
    blocking: true

  - gate_id: isolation-suite
