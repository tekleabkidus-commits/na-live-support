      within the 2 s deadline. Falsified by corrupting the SIGNED string while the wire
      string stayed correct — red at the deadline with the socket still open; restored
      green. Non-2xx terminate responses now log the auth.session.socket_close_failed
      metric (NFR-04's fail-open-with-metric; the HTTP client does not throw on 401,
      so a refused close was previously a SILENT fail-open).

