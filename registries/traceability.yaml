      relay, which was not built this session.

  # ── Doc 01 AC-04: outbox chaos ─────────────────────────────────────────────
  - ac_ref: "Doc01 AC-04"
    suite_path: tests/Isolation/OutboxChaosTest.php
    type: automated
    tier: isolation
    cadence: every-push
    environment: ci
    owner: platform-engineering
    status: partial
    gap: >-
      Proven: an event is never published for a rolled-back write; a committed event
      survives a relay that never ran; re-processing the same row yields ONE event
      (enforced by the events primary key, so duplicate delivery cannot become duplicate
      effect); relay order is UUIDv7 order with no wall clock. NOT proven: the queue-push
      half. Docs 04-17 own the consumers, so there is no queue leg to crash yet — the
      relay currently appends to `events`, which is what reporting replays from.

  # ── Doc 01 AC-05: concurrent provisioning ──────────────────────────────────
  - ac_ref: "Doc01 AC-05"
    suite_path: tests/Isolation/ConcurrentProvisioningTest.php
    type: automated
    tier: integration
    cadence: every-push
    environment: ci
    owner: platform-engineering
    status: covered
    gap: >-
      The concurrency proof uses two independent database connections with genuinely
      overlapping transactions against unique (tenant_id, step) — the loser learns it
      lost from the database, not from a check. Also proven: sequential retry (EC-05),
      double dispatch through the real job with the T-05 binding, FR-03f fail-before-
      handler, and the EC-04 mid-flight suspension halt. Roles/SLA/business-hours/KB
      steps are recorded seams: Docs 03/12/10 own their contents, so completion of
      those steps creates nothing yet — visible via isSeamAwaitingItsModule().

