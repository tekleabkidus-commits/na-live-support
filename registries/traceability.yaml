      The end-to-end journey - enrol, password-half 401, challenge, SEC-04's SECOND
      regeneration boundary proven in STORAGE, recovery-code login - runs over a real cookie
      jar in tests/Browser/session.spec.ts.

  - ac_ref: "Doc02 AC-04"
    suite_path: tests/Browser/session.spec.ts
    type: automated
    tier: browser
    cadence: every-push
    environment: ci
    owner: platform-engineering
    status: covered
    justification: >-
      BOTH HALVES PROVEN, each falsified before being counted. Eviction half
      (tests/Browser/session.spec.ts, real cookie jars, isolated per run): the 6th
      concurrent login evicts the OLDEST session and not the newest; the evicted session
      no longer authenticates; the newest survives (positive control). Asserted on
      session KEYS via auth:session-inspect, never on the index. Falsified by reversing
      the eviction order — red, then restored green. Socket half
      (tests/Integration/SessionRevocationSocketTest.php, un-skipped in S10): a REAL TLS
      websocket to the running Reverb subscribes to a presence channel carrying the
      user's id (this Reverb has no pusher:signin — S9's frame was silently ignored,
      which is why its socket survived), revocation calls terminate_connections with the
      signature built exactly as Controller::verifySignature checks it (empty body sent
      via send() — Http::post()'s implicit `[]` body was the real S9 401, via body_md5 —
      raw key=value join, one param array for sign and wire), and the socket reaches EOF
      within the 2 s deadline. Falsified by corrupting the SIGNED string while the wire
      string stayed correct — red at the deadline with the socket still open; restored
      green. Non-2xx terminate responses now log the auth.session.socket_close_failed
      metric (NFR-04's fail-open-with-metric; the HTTP client does not throw on 401,
      so a refused close was previously a SILENT fail-open).

