      zero raw-key leakage, zero missing-translation telemetry — keys added later are
      covered automatically. The C-08 chain (user → tenant default → English) and the
      per-key/locale telemetry are proven, falsified both ways. Separately and
      PERMANENTLY: the Amharic is machine-authored and needs native-speaker review
      before any real operator sees it (standing pre-launch item in BUILD-STATUS) —
      AC-06 proves no key leaks, it cannot prove the Amharic is good.

  # ── Doc 01 AC-07: p99 latency budgets under L1 ─────────────────────────────
  - ac_ref: "Doc01 AC-07"
    suite_path: tests/Performance/FoundationBudgetsTest.php
    type: automated
    tier: property
    cadence: every-push
    environment: ci
    owner: platform-engineering
    status: partial
    gap: >-
      PARTIAL BY DESIGN, dev-hardware-indicative (owner ruling). Measured strict
      (PERF_BUDGETS_ENFORCE=1 / make perf), 2000 samples: resolution p99 0.75-0.82 ms
      (budget 1.0), settings 0.17-0.24 ms (0.5), outbox publish 0.86-0.95 ms (5.0),
      registry cold-load <0.1 ms (50) — WITHIN. Events insert 0.76-1.15 ms against 1.0:
      MARGINAL, one of five runs breached; not engineered away. Default runs assert a
      5x regression ceiling only, because single-run p99 flakes on shared hardware.
      NOT measured: +3 ms on an authenticated GET (needs Doc 02), relay lag under 10x
      burst. AC-07 proper needs Doc 19's L1 profile with dashboards as evidence.

